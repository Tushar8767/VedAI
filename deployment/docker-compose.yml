version: '3.8'

services:
  # Python Multilingual ML Microservice (Internal Network Only)
  ml-service:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.ml
    container_name: vedai-ml-service
    restart: unless-stopped
    environment:
      - PORT=8001
      - MODEL_NAME=distilbert-base-multilingual-cased
    networks:
      - vedai-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Backend Orchestrator & API Service
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: vedai-backend
    restart: unless-stopped
    depends_on:
      ml-service:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - MODEL_API_URL=http://ml-service:8001/predict
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
    networks:
      - vedai-internal
      - vedai-public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Frontend Web Client (Nginx Reverse Proxy & Static SPA)
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: vedai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - vedai-public
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  vedai-internal:
    internal: true
  vedai-public:
    driver: bridge
