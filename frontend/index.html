<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕉️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VedAI 2.0 — Personal Reflection & Wisdom Workspace</title>
    <meta name="description" content="An explainable AI-powered self-reflection workspace combining emotion understanding, human validation, and Bhagavad Gita wisdom." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vedai_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.backgroundColor = '#161412';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.backgroundColor = '#FAF8F5';
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
