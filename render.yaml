# Render Blueprint Configuration for VedAI 2.0
# Deploy with 1-click on https://render.com via "New +" -> "Blueprint"

services:
  - type: web
    name: vedai
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --prefix frontend && npm install --prefix backend
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: google
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: CLIENT_URL
        value: https://vedai.onrender.com
