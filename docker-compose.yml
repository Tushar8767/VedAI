version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vedai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vedai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vedai_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vedai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vedai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ml_model:
    build:
      context: ./ml_model
      dockerfile: Dockerfile
    container_name: vedai_ml_model
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LOAD_ONLINE_MODEL=0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vedai_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=vedai
      - PGUSER=postgres
      - PGPASSWORD=${POSTGRES_PASSWORD:-vedai_secure_pass_2026}
      - MODEL_API_URL=http://ml_model:8001/predict
      - MODEL_TIMEOUT_MS=10000
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-vedai-production-super-secret-key-replace-me}
      - JWT_TTL_SECONDS=604800
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml_model:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vedai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
